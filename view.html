<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>勤怠</title>
<style>
  body{font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;background:#f5f7fa;color:#1a202c;margin:0;padding:18px 14px 48px}
  h1{font-size:19px;margin:0 0 4px}.sub{color:#667;font-size:13px;margin:0 0 16px}
  h2{font-size:14px;color:#5a6572;margin:22px 0 10px;border-left:4px solid #1565c0;padding-left:8px}
  .club{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:14px 16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .chead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .cname{font-size:16px;font-weight:700}
  .badge{font-size:14px;font-weight:700;border-radius:999px;padding:4px 12px}
  .ok{background:#e6f4e7;color:#2e7d32}.ng{background:#fdeae7;color:#c0392b}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:7px 6px;border-bottom:1px solid #eef1f4}
  th{color:#5a6572;font-size:12px;font-weight:600}
  .alert{background:#FDE3DA;border:2px solid #D9381E;border-radius:14px;padding:14px 16px;margin:0 0 16px;color:#D9381E}
  .alert b{font-size:15px}.alert ul{margin:8px 0 10px;padding-left:20px;font-size:15px;font-weight:700}
  .alert a{display:inline-block;background:#D9381E;color:#fff;font-weight:700;font-size:14px;border-radius:999px;padding:8px 16px;text-decoration:none}
  .pres{color:#2e7d32;font-weight:700}.left{color:#94a3b8}.ng-txt{color:#c0392b;font-weight:700}
  tr.subtot td{color:#5a6572;font-size:12px;background:#f8fafc}
  .clubtot{text-align:right;color:#5a6572;font-size:13px;margin-top:8px;padding-right:2px}
  .clubtot b{color:#1a202c}
  .card{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px;margin-bottom:12px;text-decoration:none;color:#1a202c;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .cn{font-size:16px;font-weight:700}.ca{font-size:15px;font-weight:700;color:#1565c0}
  .call .ca{color:#2e7d32}
  .soon{opacity:.72}.soon .ca{color:#94a3b8;font-size:12px;border:1px solid #cbd5e1;border-radius:999px;padding:3px 10px}
  .note{color:#94a3b8;font-size:12px;margin:8px 2px 0}.none{color:#94a3b8}
  /* 申請フォーム */
  .form{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .field{margin-bottom:14px}.field label{display:block;font-size:13px;font-weight:700;color:#5a6572;margin-bottom:6px}
  input,select,textarea{width:100%;font-size:16px;padding:11px 12px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;color:#1a202c;box-sizing:border-box}
  textarea{min-height:72px;resize:vertical}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  button{width:100%;font-size:16px;font-weight:700;padding:15px;border:none;border-radius:12px;color:#fff;background:#1565c0;margin-top:4px}
  button:disabled{opacity:.5}
  .msg{padding:14px;border-radius:12px;background:#fff;border:1px solid #e2e8f0;font-size:15px;line-height:1.6;white-space:pre-wrap;margin-top:12px}
  .msg.ok{color:#2e7d32;border-color:#b7e0bd}.msg.ng{color:#c0392b;border-color:#f3c9c2}
  .notice{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  /* 当月の打刻状況：月の切替と出勤簿（A4縦1枚・印刷/PDF用） */
  .mnav{display:flex;gap:8px;align-items:center;margin:0 0 12px}
  .mnav button{width:auto;flex:0 0 auto;font-size:14px;padding:9px 14px;margin:0;background:#fff;color:#1565c0;border:1px solid #cbd5e1}
  .mnav .cur{flex:1;text-align:center;font-weight:700;font-size:15px}
  #sheet{display:none;background:#fff;color:#202124;padding:14px;margin:0 auto;max-width:760px;box-sizing:border-box}
  body.preview #sheet{display:block;border:1px solid #cbd5e1}
  body.preview .screen{display:none}
  #sheet h1{font-size:18px;margin:0 0 2px;color:#202124}
  #sheet .meta{font-size:11px;color:#5F6368;margin:0 0 10px}
  #sheet table{width:100%;border-collapse:collapse;font-size:12px;margin:0 0 10px;table-layout:fixed}
  #sheet th,#sheet td{border:1px solid #5F6368;padding:3px 4px;text-align:center;color:#202124;font-size:12px;height:17px}
  #sheet th{background:#BDE3F8;font-weight:700}
  #sheet td.memo{text-align:left}
  #sheet tr.we td{background:#EEF7FD}
  #sheet td.warn{background:#FDE3DA;color:#D9381E;font-weight:700}
  #sheet .sign td{height:52px}
  .pbar{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px;margin:0 auto 12px;max-width:760px;box-sizing:border-box}
  .pbar p{font-size:13px;color:#5a6572;margin:8px 0 0;line-height:1.6}
  @page{size:A4 portrait;margin:10mm}
  @media print{
    body{background:#fff;padding:0}
    .screen,.pbar{display:none!important}
    #sheet,body.preview #sheet{display:block!important;border:none;padding:0;max-width:none}
    #sheet th,#sheet td{height:15px;padding:2px 4px}
    #sheet .sign td{height:48px}
    #sheet th,#sheet tr.we td,#sheet td.warn{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
</head>
<body>
<div id="app"><p class="sub">読み込み中…</p></div>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
  // ── 設定（案件固有。いずれも公開前提の値）────────────────────
  var LIFF_ID = '2012312534-oQ6tgba9';
  var EXEC = 'https://script.google.com/macros/s/AKfycbxqryPSyt8qmx1It988kFLDp1QAFX9NzCse-JIErJpF4DrCntuyX2j3nc_v5NCFjwMuFA/exec';
  // ───────────────────────────────────────────────────────────
  var VIEW_HTML = location.href.split('?')[0];
  var view = new URLSearchParams(location.search).get('view') || 'board';
  var app = document.getElementById('app');
  var idToken = null;
  var boardTimer = null;
  var qs = new URLSearchParams(location.search);
  var printMode = qs.get('print') === '1';   // 標準ブラウザで開いた「印刷・PDF保存」用の表示
  var printTicket = /^[0-9a-f]{64}$/.test(qs.get('ticket')||'') ? qs.get('ticket') : '';   // LINEの中で発行した引換券（5分・1回限り）。あればLINEログインなしで出勤簿を出す
  var curYm = '';                             // 今日時点の対象月（最初の読み込みで確定。これより先の月へは進めない）
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

  // バックエンドへPOST（idTokenはボディで送る＝URLログにトークンを残さない）
  function postApi(api){
    return fetch(EXEC,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({api:api,idToken:idToken})}).then(function(r){return r.json();});
  }
  function postJson(payload){
    return fetch(EXEC,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(payload)}).then(function(r){return r.json();});
  }

  function renderNeedAuth(res){
    var m=(res&&res.msg)||'本人確認が必要です。LINEのメニューから開いてください。';
    app.innerHTML='<h1>🔒 本人確認が必要です</h1>'+
      '<div class="notice"><p style="margin:0 0 6px">'+esc(m)+'</p>'+
      '<p class="note">※氏名・出退勤時刻・有休残などは、連携済みのご本人／担当者にのみ表示します。'+
      'LINEのリッチメニューから開き直してください。</p></div>';
  }

  function renderBoard(d){
    if(d&&d.needAuth){renderNeedAuth(d);return;}
    var h='<h1>📋 出勤簿（本日）</h1><p class="sub">'+esc(d.today)+'　最終更新 '+esc(d.updated)+'（30秒ごとに自動更新）</p>';
    if(d.myAlerts&&d.myAlerts.length){
      h+='<div class="alert"><b>⚠ あなたの打刻に確認が必要です</b><ul>';
      d.myAlerts.forEach(function(a){h+='<li>'+esc(a.md)+'　「'+esc(a.kind)+'」の打刻がありません</li>';});
      h+='</ul><a href="'+VIEW_HTML+'?view=fix">打刻の修正を申請する ›</a></div>';
    }
    h+='<a class="card" href="'+VIEW_HTML+'?view=mymonth" style="text-decoration:none"><span class="cn">🖨 自分の出勤簿（月ごと）をPDFで保存・印刷</span><span class="ca">開く ›</span></a>';
    if(!d.clubs.length) h+='<div class="club"><span class="none">クラブが未登録です。</span></div>';
    d.clubs.forEach(function(c){
      h+='<div class="club"><div class="chead"><span class="cname">🏫 '+esc(c.name)+'</span>'+
        '<span class="badge '+(c.ok?'ok':'ng')+'">今 '+c.present+'名在席 / 基準'+c.base+'　'+(c.ok?'○ 充足':'△ あと'+(c.base-c.present)+'名')+'</span></div>';
      if(c.people.length){
        h+='<table><tr><th>氏名</th><th>出勤</th><th>休憩</th><th>退勤</th><th>実働</th><th>状態</th></tr>';
        c.people.forEach(function(p){
          var rs=(p.rows&&p.rows.length)?p.rows:[{in:'',out:'',brk:'',work:''}];
          rs.forEach(function(s,i){
            h+='<tr><td>'+(i===0?esc(p.name):'')+'</td>'+
              '<td>'+esc(s.in||'—')+'</td><td>'+esc(s.brk||'—')+'</td><td>'+esc(s.out||'—')+'</td><td>'+esc(s.work||'—')+'</td>'+
              (i===0?('<td class="'+(p.present?'pres':'left')+'" rowspan="'+rs.length+'">'+(p.present?'● 在席':'退勤済')+'</td>'):'')+
              '</tr>';
          });
          h+='<tr class="subtot"><td></td><td colspan="4">本日計 <b>'+esc(p.dayWork||'0:00')+'</b> ／ 月累計 '+esc(p.monthWork||'0:00')+'</td><td></td></tr>';
        });
        h+='</table><div class="clubtot">クラブ計 実働 <b>'+esc(c.work||'0:00')+'</b></div>';
      }else{
        h+='<div class="none" style="font-size:13px;margin-top:4px">本日の打刻なし</div>';
      }
      h+='</div>';
    });
    h+='<h2>📈 今月の配置充足（毎日3名）'+esc(d.month||'')+'</h2>';
    if(d.summary&&d.summary.length){
      h+='<div class="club"><table><tr><th>クラブ</th><th>開所日</th><th>3名充足</th><th>不足</th><th>充足率</th></tr>';
      d.summary.forEach(function(s){
        h+='<tr><td>'+esc(s.club)+'</td><td>'+esc(s.open)+'</td><td class="pres">'+esc(s.ok)+'</td>'+
          '<td class="'+(Number(s.ng)>0?'ng-txt':'left')+'">'+esc(s.ng)+'</td><td>'+esc(s.rate)+'</td></tr>';
      });
      h+='</table></div><p class="note">※「毎日3名配置」の達成状況（補助金エビデンス）。開所日・開所時間が未確定の間は暫定値です。</p>';
    }else{
      h+='<div class="club"><span class="none">今月はまだ集計対象の打刻がありません。</span></div>';
    }
    app.innerHTML=h;
  }

  function renderContact(d){
    if(d&&d.needAuth){renderNeedAuth(d);return;}
    var h='<h1>📞 連絡・会議</h1><p class="sub">急ぎの連絡はクラブへ直接。オンライン会議は今後追加予定です。</p><h2>各クラブへ電話</h2>';
    if(!d.clubs.length) h+='<div class="card none">クラブが未登録です</div>';
    d.clubs.forEach(function(c){
      if(c.phone){var num=c.phone.replace(/[^0-9+]/g,'');
        h+='<a class="card call" href="tel:'+esc(num)+'"><span class="cn">🏫 '+esc(c.name)+'</span><span class="ca">📞 '+esc(c.phone)+'</span></a>';
      }else{h+='<div class="card"><span class="cn">🏫 '+esc(c.name)+'</span><span class="ca" style="color:#94a3b8;font-size:13px">番号 未登録</span></div>';}
    });
    h+='<p class="note">※電話番号は「クラブ一覧／クラブマスタ」で管理します（学童職員が追記可）。</p>';
    h+='<h2>オンライン会議</h2><div class="card soon"><span class="cn">🎥 かんたんWeb会議を開く</span><span class="ca">準備中</span></div>';
    h+='<p class="note">※公式LINE自体に通話機能はないため、Google Meet / Zoom のルームを開く形で今後ご提案します。</p>';
    app.innerHTML=h;
  }

  // 有休：残日数の確認＋申請（全日／半日／時間）＋自分の申請の一覧・取り下げ
  var ykData=null;
  function loadYukyu(){
    postJson({api:'yukyuform',idToken:idToken}).then(renderYukyu).catch(function(e){app.innerHTML='<p class="sub">読み込みに失敗しました。通信環境を確認して再読み込みしてください。<br>'+esc(e)+'</p>';});
  }
  function ykDays(kind,hours){   // 画面での目安（最終の判定はバックエンド）
    if(kind==='全日') return 1; if(kind==='半日') return 0.5;
    var h=Number(hours); if(kind==='時間'&&h>0&&ykData&&ykData.shotei>0) return Math.round(h/ykData.shotei*10000)/10000;
    return 0;
  }
  function renderYukyu(d){
    if(d&&d.needAuth){renderNeedAuth(d);return;}
    if(!d||!d.ok){ app.innerHTML='<p class="sub">'+esc((d&&d.msg)||'表示できませんでした。時間をおいて再度お試しください。')+'</p>'; return; }
    ykData=d;
    var h='<h1>🌴 有休の残日数・申請</h1><p class="sub">'+esc(d.name||'')+' さん</p>';
    if(!d.granted){
      h+='<div class="alert"><b>⚠ 有休の付与がまだ登録されていません</b><p style="margin:8px 0 0;font-size:14px;font-weight:400;color:#1a202c">事務局が付与日数を登録すると、ここに残日数が出て申請できるようになります。</p></div>';
    } else {
      h+='<div class="club"><div class="chead"><span class="cname">申請できる日数</span><span class="badge '+(d.available>0?'ok':'ng')+'">'+esc(d.available)+' 日</span></div>'+
         '<table><tr><th>残日数</th><th>承認待ち</th><th>取得済み</th><th>次の付与日</th></tr><tr><td>'+esc(d.left)+' 日</td><td>'+esc(d.pending)+' 日</td><td>'+esc(d.taken)+' 日</td><td>'+esc(d.nextGrant||'—')+'</td></tr></table></div>';
      h+='<h2>有休を申請する</h2><div class="form">'+
         '<div class="field"><label>取得日</label><input type="date" id="y-date"></div>'+
         '<div class="field"><label>種別</label><select id="y-kind"><option value="全日">全日（1日）</option><option value="半日">半日（0.5日）</option>'+(d.shotei>0?'<option value="時間">時間単位</option>':'')+'</select></div>'+
         '<div class="field" id="y-hours-wrap" style="display:none"><label>時間数（1日の所定 '+esc(d.shotei)+' 時間）</label><input type="number" id="y-hours" min="1" step="1" inputmode="numeric" placeholder="例：2（1時間単位）"></div>'+
         '<div id="y-warn" class="msg ng" style="display:none;margin:0 0 12px"></div>'+
         '<button type="button" id="y-send">申請する</button>'+
         '<p class="note">※承認は 上長 → 最終承認 の順です。毎月'+esc(d.cutoffDay)+'日までに承認が済んだ分が、その月（20日〆）の給与に反映されます。休む理由の入力は不要です。</p>'+
         '<div id="y-msg" class="msg" style="display:none"></div></div>';
    }
    h+='<h2>自分の申請</h2>';
    var rq=d.requests||[];
    if(!rq.length) h+='<div class="club"><span class="none">申請はまだありません。</span></div>';
    else {
      h+='<div class="club"><table><tr><th>取得日</th><th>種別</th><th>日数</th><th>状態</th><th></th></tr>';
      rq.forEach(function(r){
        var st=String(r.status||''), cls=(st==='成立')?'pres':((st==='却下')?'ng-txt':'');
        h+='<tr><td>'+esc(mmdd(r.date))+'</td><td>'+esc(r.kind)+(r.kind==='時間'?'（'+esc(r.hours)+'h）':'')+'</td><td>'+esc(r.days)+'</td><td class="'+cls+'">'+esc(st==='成立'?'承認済み':st)+'</td>'+
           '<td>'+(r.canCancel?'<a href="#" data-yk-cancel="'+esc(r.id)+'" style="color:#c0392b;font-weight:700;text-decoration:none">取り下げ</a>':'')+'</td></tr>';
      });
      h+='</table></div><p class="note">※承認済みの有休を取り消したい時は、事務局にご連絡ください。</p>';
    }
    var tm=d.team||[];
    if(tm.length){   // 組織図に載っている管理者だけ：担当範囲の職員の残日数
      h+='<h2>担当範囲の残日数（管理者向け）</h2><div class="club"><table><tr><th>氏名</th><th>残</th><th>承認待ち</th><th>次の付与日</th></tr>';
      tm.forEach(function(p){
        h+='<tr><td>'+esc(p.name)+'<br><span style="color:#94a3b8;font-size:11px">'+esc(p.club)+'</span></td>'+
           (p.granted?('<td class="'+(p.left<0?'ng-txt':'')+'">'+esc(p.left)+' 日</td>'):'<td class="none">未登録</td>')+
           '<td>'+(p.pending?esc(p.pending)+' 日':'—')+'</td><td>'+esc(p.nextGrant||'—')+'</td></tr>';
      });
      h+='</table></div><p class="note">※全員分の詳しい内容は、出勤簿ブックの「有休台帳」で確認できます。</p>';
    }
    app.innerHTML=h;
    var kind=document.getElementById('y-kind'), hw=document.getElementById('y-hours-wrap'), hrs=document.getElementById('y-hours'),
        warn=document.getElementById('y-warn'), send=document.getElementById('y-send'), msg=document.getElementById('y-msg'), dt=document.getElementById('y-date');
    function check(){   // 残日数が足りない時は ⚠ を出して送れないようにする
      if(!send) return;
      var days=ykDays(kind.value,hrs?hrs.value:''), short=days>0&&days>d.available;
      hw.style.display=(kind.value==='時間')?'block':'none';
      warn.style.display=short?'block':'none';
      warn.textContent=short?('⚠ 残日数が足りないため申請できません（申請 '+days+'日 ／ 申請できる日数 '+d.available+'日）。事務局にご相談ください。'):'';
      send.disabled=short||d.available<=0;
      if(d.available<=0){ warn.style.display='block'; warn.textContent='⚠ 申請できる日数がありません（残 '+d.left+'日・承認待ち '+d.pending+'日）。事務局にご相談ください。'; }
    }
    if(send){
      kind.addEventListener('change',check); if(hrs) hrs.addEventListener('input',check); check();
      send.addEventListener('click',function(){
        if(!dt.value){ msg.style.display='block'; msg.className='msg ng'; msg.textContent='⚠️ 取得日を入れてください。'; return; }
        send.disabled=true; msg.style.display='block'; msg.className='msg'; msg.textContent='送信中…';
        postJson({source:'yukyu-request',idToken:idToken,date:dt.value,kind:kind.value,hours:(kind.value==='時間'&&hrs)?hrs.value:''}).then(function(res){
          if(res&&res.ok){ msg.className='msg ok'; msg.textContent='✅ '+(res.msg||'申請しました。承認をお待ちください。'); setTimeout(loadYukyu,1500); }
          else { msg.className='msg ng'; msg.textContent=(res&&res.msg)||'⚠️ 申請に失敗しました。時間をおいて再度お試しください。'; send.disabled=false; check(); }
        }).catch(function(e){ msg.className='msg ng'; msg.textContent='送信に失敗しました。通信環境を確認してください。\n'+e; send.disabled=false; });
      });
    }
    app.querySelectorAll('[data-yk-cancel]').forEach(function(a){
      a.addEventListener('click',function(ev){
        ev.preventDefault();
        if(!window.confirm('この申請を取り下げますか？')) return;
        postJson({api:'yukyucancel',idToken:idToken,id:a.getAttribute('data-yk-cancel')}).then(function(res){
          if(!(res&&res.ok)) window.alert((res&&res.msg)||'取り下げできませんでした。');
          loadYukyu();
        }).catch(function(){ window.alert('通信に失敗しました。もう一度お試しください。'); });
      });
    });
  }

  // 当月の打刻状況（本人・20日〆期間の日別＋労働時間/時間外）
  function mmdd(s){ s=String(s||''); var m=s.match(/^\d{4}-(\d{2})-(\d{2})/); return m?(Number(m[1])+'/'+Number(m[2])):s; }
  function ymOfTo(to){ var m=String(to||'').match(/^(\d{4})-(\d{2})/); return m?(m[1]+'-'+m[2]):''; }
  function shiftYm(ym,delta){ var p=String(ym).split('-'); var y=Number(p[0]), m=Number(p[1])+delta; while(m<1){m+=12;y--;} while(m>12){m-=12;y++;} return y+'-'+(m<10?'0'+m:m); }
  function p2(n){ return (n<10?'0':'')+n; }
  // 期間（from〜to・'yyyy-MM-dd'）の日付を1日ずつ並べる
  function periodDates(from,to){
    var a=String(from).split('-'), out=[]; if(a.length<3) return out;
    var d=new Date(Number(a[0]),Number(a[1])-1,Number(a[2]));
    for(var i=0;i<40;i++){
      var s=d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
      if(s>to) break;
      out.push({date:s, md:(d.getMonth()+1)+'/'+d.getDate(), wd:'日月火水木金土'.charAt(d.getDay()), we:(d.getDay()===0||d.getDay()===6)});
      d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);
    }
    return out;
  }
  function todayStr(){ var t=new Date(); return t.getFullYear()+'-'+p2(t.getMonth()+1)+'-'+p2(t.getDate()); }
  // 出勤簿（A4縦1枚）。画面の一覧と同じデータ（mymonth）から作る＝数字は月次集計と同じ
  function sheetHtml(d){
    var t=d.totals||{}, per=d.period||{}, by={}, today=todayStr();
    (d.days||[]).forEach(function(x){ by[x.date]=x; });
    var closed = today > String(per.to||'');
    var h='<h1>出勤簿　'+esc(d.label||'')+'</h1>';
    h+='<p class="meta">期間 '+esc(per.from||'')+' 〜 '+esc(per.to||'')+'　／　'+(closed?'〆後':'途中経過（〆前）')+'　／　出力 '+esc(today)+'</p>';
    h+='<table><tr><th>氏名</th><th>出勤日数</th><th>労働時間</th><th>時間外（普通）</th><th>時間外（深夜）</th></tr>';
    h+='<tr><td>'+esc(d.name||'')+'</td><td>'+(t.days||0)+'</td><td>'+esc(t.work||'0:00')+'</td><td>'+esc(t.otN||'0:00')+'</td><td>'+esc(t.otL||'0:00')+'</td></tr></table>';
    h+='<table><colgroup><col style="width:10%"><col style="width:8%"><col style="width:11%"><col style="width:11%"><col style="width:11%"><col style="width:11%"><col style="width:11%"><col></colgroup>';
    h+='<tr><th>日付</th><th>曜日</th><th>出勤</th><th>退勤</th><th>休憩</th><th>実働</th><th>時間外</th><th>備考</th></tr>';
    periodDates(per.from,per.to).forEach(function(dd){
      var x=by[dd.date]||{}, memo='', warn=false;
      if(x.noOut!==undefined){
        // バックエンドの判定（月次集計の要確認と同じ。中抜けで最後の出勤だけ閉じていない日も拾う）
        var ms=[]; if(x.noOut){ms.push('退勤の打刻なし');warn=true;} if(x.noIn){ms.push('出勤の打刻なし');warn=true;} if(x.open&&!x.noOut) ms.push('在席中');
        if(x.brkNote) ms.push(x.brkNote);
        memo=ms.join('・');
      } else if(x.in&&!x.out){ if(dd.date<today){memo='退勤の打刻なし';warn=true;} else memo='在席中'; }   // 旧バックエンド向けの簡易判定
      else if(!x.in&&x.out){ memo='出勤の打刻なし'; warn=true; }
      h+='<tr'+(dd.we?' class="we"':'')+'><td>'+esc(dd.md)+'</td><td>'+esc(dd.wd)+'</td><td>'+esc(x.in||'')+'</td><td>'+esc(x.out||'')+'</td><td>'+esc(x.brk||'')+'</td><td>'+esc(x.work||'')+'</td><td>'+esc(x.ot||'')+'</td><td class="memo'+(warn?' warn':'')+'">'+esc(memo)+'</td></tr>';
    });
    h+='</table><table class="sign"><tr><th>本人確認</th><th>事務局確認</th></tr><tr><td></td><td></td></tr></table>';
    return h;
  }

        '<div class="field"><label>実際に取れた休憩</label><select id="b-min">'+opts+'</select></div>'+
        '<div class="field"><label>理由</label><textarea id="b-reason" placeholder="例）夏休みの1日保育で、おでかけの引率のため"></textarea></div>'+
        '<button id="b-send">この内容で申請する</button>'+
      '</div><p class="note">※自動でつく分の休憩を取れた日は申請不要です。出した申請を取り消す時は「打刻の修正を申請」でその日を開き、「休憩の申請」の［取消］を押してください。</p>'+
      '<div id="b-msg"></div>'+
      '<a class="card" href="'+VIEW_HTML+'?view=shinsei" style="text-decoration:none;margin-top:16px"><span class="cn">各種申請へ戻る</span><span class="ca">›</span></a>';
    document.getElementById('b-send').addEventListener('click',function(){
      var msg=document.getElementById('b-msg'), btn=document.getElementById('b-send');
      var date=document.getElementById('b-date').value, minutes=document.getElementById('b-min').value, reason=document.getElementById('b-reason').value;
      if(!date){ msg.className='msg ng'; msg.textContent='対象の日を選んでください。'; return; }
      if(!idToken){ msg.className='msg ng'; msg.textContent='本人確認がまだです。LINEのメニューから開き直してください。'; return; }
      if(brkSending) return;                                 // 送信中は重ねて送らない
      brkSending=true; btn.disabled=true;
      msg.className='msg'; msg.textContent='申請を送信中…（そのままお待ちください）';
      postJson({source:'fix-request',op:'brk',idToken:idToken,date:date,minutes:minutes,reason:reason}).then(function(res){
        brkSending=false; btn.disabled=false;
        if(res&&res.ok){ msg.className='msg ok'; msg.textContent='✅ '+(res.msg||'申請しました。承認をお待ちください。'); }
        else { msg.className='msg ng'; msg.textContent='⚠️ '+((res&&res.msg)||'申請に失敗しました。時間をおいて再度お試しください。'); }
      }).catch(function(e){ brkSending=false; btn.disabled=false; msg.className='msg ng'; msg.textContent='送信に失敗しました。通信環境を確認してください。\n'+e; });
    });
  }

  // op: 'add'|'cancel'|'edit' を送信（氏名はidTokenで自動特定＝送らない）
  var fixSending=false;
  function submitFixOp(op,target,type,time){
    var msg=document.getElementById('f-msg');
    var date=document.getElementById('f-date').value;
    var reason=document.getElementById('f-reason').value;
    if(!date){ msg.className='msg ng'; msg.textContent='対象の日を選んでください。'; return; }
    if((op==='add'||op==='edit')&&!time){ msg.className='msg ng'; msg.textContent='時刻を入力してください。'; return; }
    if(!idToken){ msg.className='msg ng'; msg.textContent='本人確認がまだです。LINEのメニューから開き直してください。'; return; }
    if(fixSending) return;                                   // 送信中は重ねて送らない（連打で同じ申請が何件もできるのを防ぐ）
    fixSending=true;
    var lock=function(on){ var bs=app.querySelectorAll('button'); for(var i=0;i<bs.length;i++) bs[i].disabled=on; };
    lock(true);
    msg.className='msg'; msg.textContent='申請を送信中…（そのままお待ちください）';
    postJson({source:'fix-request',op:op,idToken:idToken,date:date,target:target||'',type:type||'',time:time||'',reason:reason}).then(function(res){
      fixSending=false; lock(false);
      if(res&&res.ok){ msg.className='msg ok'; msg.textContent='✅ '+(res.msg||'申請しました。承認をお待ちください。'); fixPending=null; loadMyPunches(); }
      else { msg.className='msg ng'; msg.textContent='⚠️ '+((res&&res.msg)||'申請に失敗しました。時間をおいて再度お試しください。'); }
    }).catch(function(e){ fixSending=false; lock(false); msg.className='msg ng'; msg.textContent='送信に失敗しました。通信環境を確認してください。\n'+e; });
  }

  function load(){
    if(view==='shinsei'){renderShinsei();return;}
    if(view==='fix'){renderFixForm();return;}
    if(view==='brk'){renderBrkForm();return;}
    if(view==='mymonth'){loadMyMonth(/^\d{4}-\d{1,2}$/.test(qs.get('ym')||'')?qs.get('ym'):'');return;}
    if(view==='yukyu'){loadYukyu();return;}
    var fn=view==='contact'?renderContact:renderBoard;
    var api=(view==='contact')?view:'board';
    postApi(api).then(fn).catch(function(e){app.innerHTML='<p class="sub">読み込みに失敗しました。通信環境を確認して再読み込みしてください。<br>'+esc(e)+'</p>';});
  }

  // LIFF初期化 → idToken取得 → 画面描画（本人確認を全ビュー共通の前提にする）
  function start(){
    if(printMode&&printTicket&&view==='mymonth'){ loadByTicket(); return; }   // 標準ブラウザ＋引換券：LINEログインなしで出勤簿だけ出す
    if(!window.liff){ app.innerHTML='<p class="sub">LIFF SDKを読み込めません（通信環境を確認してください）。</p>'; return; }
    liff.init({liffId:LIFF_ID}).then(function(){
      // 印刷用に外部ブラウザで開いた時は、ログイン後に同じ月・同じ表示へ戻す
      if(!liff.isLoggedIn()){ if(printMode) liff.login({redirectUri:location.href}); else liff.login(); return; }
      idToken=liff.getIDToken();
      if(!idToken){
        if(!sessionStorage.getItem('kp_relogin_v')){ sessionStorage.setItem('kp_relogin_v','1'); if(printMode) liff.login({redirectUri:location.href}); else liff.login(); return; }
        app.innerHTML='<p class="sub">本人確認トークンを取得できません。LIFFのScopeに「openid」が入っているかご確認ください。</p>'; return;
      }
      sessionStorage.removeItem('kp_relogin_v');
      load();
      if(view==='board'){ if(boardTimer) clearInterval(boardTimer); boardTimer=setInterval(load,30000); }
    }).catch(function(e){
      app.innerHTML='<p class="sub">初期化に失敗しました。LINEのメニューから開き直してください。<br>'+esc(e&&e.message?e.message:e)+'</p>';
    });
  }
  start();
</script>
</body>
</html>

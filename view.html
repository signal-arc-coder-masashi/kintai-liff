<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>勤怠</title>
<style>
  body{font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;background:#f5f7fa;color:#1a202c;margin:0;padding:18px 14px 48px}
  h1{font-size:19px;margin:0 0 4px}.sub{color:#667;font-size:13px;margin:0 0 16px}
  h2{font-size:14px;color:#5a6572;margin:22px 0 10px;border-left:4px solid #1565c0;padding-left:8px}
  .club{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:14px 16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .chead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .cname{font-size:16px;font-weight:700}
  .badge{font-size:14px;font-weight:700;border-radius:999px;padding:4px 12px}
  .ok{background:#e6f4e7;color:#2e7d32}.ng{background:#fdeae7;color:#c0392b}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:7px 6px;border-bottom:1px solid #eef1f4}
  th{color:#5a6572;font-size:12px;font-weight:600}
  .pres{color:#2e7d32;font-weight:700}.left{color:#94a3b8}.ng-txt{color:#c0392b;font-weight:700}
  .card{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px;margin-bottom:12px;text-decoration:none;color:#1a202c;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .cn{font-size:16px;font-weight:700}.ca{font-size:15px;font-weight:700;color:#1565c0}
  .call .ca{color:#2e7d32}
  .soon{opacity:.72}.soon .ca{color:#94a3b8;font-size:12px;border:1px solid #cbd5e1;border-radius:999px;padding:3px 10px}
  .note{color:#94a3b8;font-size:12px;margin:8px 2px 0}.none{color:#94a3b8}
  /* 申請フォーム */
  .form{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .field{margin-bottom:14px}.field label{display:block;font-size:13px;font-weight:700;color:#5a6572;margin-bottom:6px}
  input,select,textarea{width:100%;font-size:16px;padding:11px 12px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;color:#1a202c;box-sizing:border-box}
  textarea{min-height:72px;resize:vertical}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  button{width:100%;font-size:16px;font-weight:700;padding:15px;border:none;border-radius:12px;color:#fff;background:#1565c0;margin-top:4px}
  button:disabled{opacity:.5}
  .msg{padding:14px;border-radius:12px;background:#fff;border:1px solid #e2e8f0;font-size:15px;line-height:1.6;white-space:pre-wrap;margin-top:12px}
  .msg.ok{color:#2e7d32;border-color:#b7e0bd}.msg.ng{color:#c0392b;border-color:#f3c9c2}
  .notice{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
</style>
</head>
<body>
<div id="app"><p class="sub">読み込み中…</p></div>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
  // ── 設定（案件固有。いずれも公開前提の値）────────────────────
  var LIFF_ID = '2012312534-oQ6tgba9';
  var EXEC = 'https://script.google.com/macros/s/AKfycbxqryPSyt8qmx1It988kFLDp1QAFX9NzCse-JIErJpF4DrCntuyX2j3nc_v5NCFjwMuFA/exec';
  // ───────────────────────────────────────────────────────────
  var VIEW_HTML = location.href.split('?')[0];
  var view = new URLSearchParams(location.search).get('view') || 'board';
  var app = document.getElementById('app');
  var idToken = null;
  var boardTimer = null;
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

  // バックエンドへPOST（idTokenはボディで送る＝URLログにトークンを残さない）
  function postApi(api){
    return fetch(EXEC,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({api:api,idToken:idToken})}).then(function(r){return r.json();});
  }
  function postJson(payload){
    return fetch(EXEC,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(payload)}).then(function(r){return r.json();});
  }

  function renderNeedAuth(res){
    var m=(res&&res.msg)||'本人確認が必要です。LINEのメニューから開いてください。';
    app.innerHTML='<h1>🔒 本人確認が必要です</h1>'+
      '<div class="notice"><p style="margin:0 0 6px">'+esc(m)+'</p>'+
      '<p class="note">※氏名・出退勤時刻・有給残などは、連携済みのご本人／担当者にのみ表示します。'+
      'LINEのリッチメニューから開き直してください。</p></div>';
  }

  function renderBoard(d){
    if(d&&d.needAuth){renderNeedAuth(d);return;}
    var h='<h1>📋 出勤簿（本日）</h1><p class="sub">'+esc(d.today)+'　最終更新 '+esc(d.updated)+'（30秒ごとに自動更新）</p>';
    if(!d.clubs.length) h+='<div class="club"><span class="none">クラブが未登録です。</span></div>';
    d.clubs.forEach(function(c){
      h+='<div class="club"><div class="chead"><span class="cname">🏫 '+esc(c.name)+'</span>'+
        '<span class="badge '+(c.ok?'ok':'ng')+'">今 '+c.present+'名在席 / 基準'+c.base+'　'+(c.ok?'○ 充足':'△ あと'+(c.base-c.present)+'名')+'</span></div>';
      if(c.people.length){
        h+='<table><tr><th>氏名</th><th>出勤</th><th>休憩</th><th>退勤</th><th>状態</th></tr>';
        c.people.forEach(function(p){
          var brk=(p.bs||p.be)?(esc(p.bs||'—')+'〜'+esc(p.be||'')):'—';
          h+='<tr><td>'+esc(p.name)+'</td><td>'+esc(p.in||'—')+'</td><td>'+brk+'</td><td>'+esc(p.out||'—')+'</td>'+
            '<td class="'+(p.present?'pres':'left')+'">'+(p.present?'● 在席':'退勤済')+'</td></tr>';
        });
        h+='</table>';
      }else{
        h+='<div class="none" style="font-size:13px;margin-top:4px">本日の打刻なし</div>';
      }
      h+='</div>';
    });
    h+='<h2>📈 今月の配置充足（毎日3名）'+esc(d.month||'')+'</h2>';
    if(d.summary&&d.summary.length){
      h+='<div class="club"><table><tr><th>クラブ</th><th>開所日</th><th>3名充足</th><th>不足</th><th>充足率</th></tr>';
      d.summary.forEach(function(s){
        h+='<tr><td>'+esc(s.club)+'</td><td>'+esc(s.open)+'</td><td class="pres">'+esc(s.ok)+'</td>'+
          '<td class="'+(Number(s.ng)>0?'ng-txt':'left')+'">'+esc(s.ng)+'</td><td>'+esc(s.rate)+'</td></tr>';
      });
      h+='</table></div><p class="note">※「毎日3名配置」の達成状況（補助金エビデンス）。開所日・開所時間が未確定の間は暫定値です。</p>';
    }else{
      h+='<div class="club"><span class="none">今月はまだ集計対象の打刻がありません。</span></div>';
    }
    app.innerHTML=h;
  }

  function renderContact(d){
    if(d&&d.needAuth){renderNeedAuth(d);return;}
    var h='<h1>📞 連絡・会議</h1><p class="sub">急ぎの連絡はクラブへ直接。オンライン会議は今後追加予定です。</p><h2>各クラブへ電話</h2>';
    if(!d.clubs.length) h+='<div class="card none">クラブが未登録です</div>';
    d.clubs.forEach(function(c){
      if(c.phone){var num=c.phone.replace(/[^0-9+]/g,'');
        h+='<a class="card call" href="tel:'+esc(num)+'"><span class="cn">🏫 '+esc(c.name)+'</span><span class="ca">📞 '+esc(c.phone)+'</span></a>';
      }else{h+='<div class="card"><span class="cn">🏫 '+esc(c.name)+'</span><span class="ca" style="color:#94a3b8;font-size:13px">番号 未登録</span></div>';}
    });
    h+='<p class="note">※電話番号は「クラブ一覧／クラブマスタ」で管理します（学童職員が追記可）。</p>';
    h+='<h2>オンライン会議</h2><div class="card soon"><span class="cn">🎥 かんたんWeb会議を開く</span><span class="ca">準備中</span></div>';
    h+='<p class="note">※公式LINE自体に通話機能はないため、Google Meet / Zoom のルームを開く形で今後ご提案します。</p>';
    app.innerHTML=h;
  }

  function renderYukyu(d){
    if(d&&d.needAuth){renderNeedAuth(d);return;}
    var h='<h1>📊 有給の残日数</h1><p class="sub">本人（担当者は全員分）の付与・取得・残（残＝付与−取得）。※現在はデモ値です。</p>';
    if(!d.people||!d.people.length) h+='<div class="card none">表示できる有給データがありません</div>';
    (d.people||[]).forEach(function(p){
      h+='<div class="card"><span class="cn">'+esc(p.name)+'</span><span class="ca">残 <b style="font-size:20px">'+esc(p.left)+'</b> 日 '+
        '<span style="color:#94a3b8;font-weight:600;font-size:12px">（付与'+esc(p.grant)+'・取得'+esc(p.taken)+'）</span></span></div>';
    });
    h+='<p class="note">※Phase1では、有給申請が承認されると「取得」が自動加算され、残が自動更新されます。</p>';
    app.innerHTML=h;
  }

  // 当月の打刻状況（本人・20日〆期間の日別＋労働時間/時間外）
  function mmdd(s){ s=String(s||''); var m=s.match(/^\d{4}-(\d{2})-(\d{2})/); return m?(Number(m[1])+'/'+Number(m[2])):s; }
  function renderMyMonth(d){
    if(d&&d.needAuth){renderNeedAuth(d);return;}
    var t=(d&&d.totals)||{};
    var h='<h1>📅 当月の打刻状況</h1><p class="sub">'+esc(d.label||'')+'（'+esc((d.period&&d.period.from)||'')+'〜'+esc((d.period&&d.period.to)||'')+'）　'+esc(d.name||'')+' さん</p>';
    h+='<div class="club"><b>合計</b>　出勤 '+(t.days||0)+'日 ／ 実働 '+esc(t.work||'0:00')+' ／ 時間外 '+esc(t.ot||'0:00')+'（うち深夜 '+esc(t.otL||'0:00')+'）</div>';
    var days=(d&&d.days)||[];
    if(!days.length){ h+='<div class="club"><span class="none">この期間の打刻はまだありません。</span></div>'; app.innerHTML=h; return; }
    h+='<div class="club"><table><tr><th>日付</th><th>出勤</th><th>休憩</th><th>退勤</th><th>実働</th><th>時間外</th></tr>';
    days.forEach(function(p){
      h+='<tr><td>'+esc(mmdd(p.date))+'</td><td>'+esc(p.in||'—')+'</td><td>'+esc(p.brk||'—')+'</td><td>'+esc(p.out||'—')+'</td><td>'+esc(p.work||'—')+'</td>'+
        '<td class="'+(p.ot?'ng-txt':'')+'">'+esc(p.ot||'—')+'</td></tr>';
    });
    h+='</table></div><p class="note">※「当月」は給与と同じ20日〆（前月21〜当月20）。取消した打刻は除外。打刻の誤りは「各種申請 → 打刻の修正」から直せます。</p>';
    app.innerHTML=h;
  }

  function renderShinsei(){
    var soon=function(i,l){return '<div class="card soon"><span class="cn">'+i+' '+l+'</span><span class="ca">準備中</span></div>';};
    var h='<h1>📝 各種申請</h1><p class="sub">打刻の修正は今すぐ申請できます。休暇・有給の申請は順次ここに追加します。</p>';
    h+='<h2>打刻の修正</h2><a class="card" href="'+VIEW_HTML+'?view=fix" style="text-decoration:none"><span class="cn">🛠 打刻の修正を申請</span><span class="ca">申請する ›</span></a>';
    h+='<p class="note">打ち忘れの追加、押し間違いの取消、時刻の修正ができます。上長・理事長/事務局長の承認で反映されます。お名前はLINEの本人確認から自動で判定します。</p>';
    h+='<h2>予定申請（事前に申請）</h2>'+soon('🌴','有給休暇の申請')+soon('🕑','半休の申請')+soon('🔁','振替・代休の申請');
    h+='<h2>当日申請（急ぎの連絡）</h2>'+soon('🤒','当日欠勤の連絡')+soon('🏃','遅刻の連絡')+soon('🏠','早退の連絡');
    h+='<h2>照会</h2>';
    h+='<a class="card" href="'+VIEW_HTML+'?view=mymonth" style="text-decoration:none"><span class="cn">📅 当月の打刻状況</span><span class="ca">見る ›</span></a>';
    h+='<a class="card" href="'+VIEW_HTML+'?view=yukyu" style="text-decoration:none"><span class="cn">📊 有給の残日数を確認</span><span class="ca">見る ›</span></a>'+soon('🗂','申請状況を確認');
    h+='<p class="note">※「当月の打刻状況」は自分の当月（20日〆）の出退勤・労働時間・時間外を表示。「有給の残日数」は稼働（デモ）。</p>';
    app.innerHTML=h;
  }

  // 打刻修正の申請フォーム（★氏名欄なし＝申請者はLINEの本人確認で自動特定。他人名義の申請は不可）
  //   ①その日のあなたの打刻を一覧→押し間違いは「取消」・時刻ズレは「時刻を直す」／②打ち忘れは「追加」
  var fixPunches=[], fixPending=null; // fixPending={logId, mode:'cancel'|'edit'}
  function renderFixForm(){
    var d=new Date();
    var today=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
    var h='<h1>🛠 打刻の修正を申請</h1><p class="sub">押し間違いは「取消」、時刻のズレは「時刻を直す」。打ち忘れは下の「追加」から。いずれも上長→理事長/事務局長の承認で反映されます。</p>'+
      '<div class="form">'+
        '<div class="field"><label>対象の日</label><input type="date" id="f-date" value="'+today+'"></div>'+
        '<div class="field"><label>理由（任意・取消／時刻変更／追加に共通）</label><textarea id="f-reason" placeholder="例）出勤を押すつもりで退勤を押したため"></textarea></div>'+
      '</div>'+
      '<h2>この日のあなたの打刻</h2><div id="f-list"><p class="note">読み込み中…</p></div>'+
      '<h2>打ち忘れを追加</h2><div class="form">'+
        '<div class="field"><label>種別</label><select id="f-type">'+
          '<option value="出勤">出勤</option><option value="退勤">退勤</option>'+
          '<option value="休憩開始">休憩開始</option><option value="休憩終了">休憩終了</option></select></div>'+
        '<div class="field"><label>正しい時刻</label><input type="time" id="f-time"></div>'+
        '<button id="f-add">この内容で追加申請する</button>'+
      '</div><p class="note">※お名前はLINEの本人確認から自動で判定します（入力不要）。</p>'+
      '<div id="f-msg"></div>';
    app.innerHTML=h;
    document.getElementById('f-date').addEventListener('change',loadMyPunches);
    document.getElementById('f-add').addEventListener('click',function(){
      submitFixOp('add','',document.getElementById('f-type').value,document.getElementById('f-time').value);
    });
    document.getElementById('f-list').addEventListener('click',onFixListClick);
    loadMyPunches();
  }

  // その日の本人の打刻を取得して一覧描画（取消/時刻変更の対象選択）
  function loadMyPunches(){
    fixPending=null;
    var date=document.getElementById('f-date').value;
    var box=document.getElementById('f-list');
    box.innerHTML='<p class="note">読み込み中…</p>';
    postJson({api:'mypunches',idToken:idToken,date:date}).then(function(res){
      if(res&&res.needAuth){ box.innerHTML='<p class="note">本人確認が必要です。LINEのメニューから開き直してください。</p>'; return; }
      fixPunches=(res&&res.punches)||[];
      renderFixList();
    }).catch(function(){ box.innerHTML='<p class="note">打刻の読み込みに失敗しました。再読み込みしてください。</p>'; });
  }

  function renderFixList(){
    var box=document.getElementById('f-list');
    if(!fixPunches.length){ box.innerHTML='<p class="none" style="font-size:13px">この日の打刻はありません。打ち忘れは下の「追加」からどうぞ。</p>'; return; }
    var h='';
    fixPunches.forEach(function(p,i){
      h+='<div class="card"><span class="cn">'+esc(p.time)+'　'+esc(p.type)+'</span><span class="ca">';
      if(fixPending&&fixPending.logId===p.logId&&fixPending.mode==='edit'){
        h+='<input type="time" id="f-newtime" value="'+esc(p.time)+'" style="width:118px"> '+
           '<button data-act="edit-ok" data-i="'+i+'">確定</button> <button data-act="ui-cancel" data-i="'+i+'">やめる</button>';
      }else if(fixPending&&fixPending.logId===p.logId&&fixPending.mode==='cancel'){
        h+='取り消しますか？ <button data-act="del-ok" data-i="'+i+'">実行</button> <button data-act="ui-cancel" data-i="'+i+'">やめる</button>';
      }else{
        h+='<button data-act="del" data-i="'+i+'">取消</button> <button data-act="edit" data-i="'+i+'">時刻を直す</button>';
      }
      h+='</span></div>';
    });
    box.innerHTML=h;
  }

  function onFixListClick(e){
    var b=e.target.closest&&e.target.closest('button'); if(!b) return;
    var act=b.getAttribute('data-act'), i=Number(b.getAttribute('data-i')), p=fixPunches[i];
    if(act==='ui-cancel'){ fixPending=null; renderFixList(); return; }
    if(!p) return;
    if(act==='del'){ fixPending={logId:p.logId,mode:'cancel'}; renderFixList(); return; }
    if(act==='edit'){ fixPending={logId:p.logId,mode:'edit'}; renderFixList(); return; }
    if(act==='del-ok'){ submitFixOp('cancel',p.logId,p.type,p.time); return; }
    if(act==='edit-ok'){ var nt=document.getElementById('f-newtime'); submitFixOp('edit',p.logId,p.type,nt?nt.value:''); return; }
  }

  // op: 'add'|'cancel'|'edit' を送信（氏名はidTokenで自動特定＝送らない）
  function submitFixOp(op,target,type,time){
    var msg=document.getElementById('f-msg');
    var date=document.getElementById('f-date').value;
    var reason=document.getElementById('f-reason').value;
    if(!date){ msg.className='msg ng'; msg.textContent='対象の日を選んでください。'; return; }
    if((op==='add'||op==='edit')&&!time){ msg.className='msg ng'; msg.textContent='時刻を入力してください。'; return; }
    if(!idToken){ msg.className='msg ng'; msg.textContent='本人確認がまだです。LINEのメニューから開き直してください。'; return; }
    msg.className='msg'; msg.textContent='申請を送信中…';
    postJson({source:'fix-request',op:op,idToken:idToken,date:date,target:target||'',type:type||'',time:time||'',reason:reason}).then(function(res){
      if(res&&res.ok){ msg.className='msg ok'; msg.textContent='✅ '+(res.msg||'申請しました。承認をお待ちください。'); fixPending=null; loadMyPunches(); }
      else { msg.className='msg ng'; msg.textContent='⚠️ '+((res&&res.msg)||'申請に失敗しました。時間をおいて再度お試しください。'); }
    }).catch(function(e){ msg.className='msg ng'; msg.textContent='送信に失敗しました。通信環境を確認してください。\n'+e; });
  }

  function load(){
    if(view==='shinsei'){renderShinsei();return;}
    if(view==='fix'){renderFixForm();return;}
    if(view==='mymonth'){postApi('mymonth').then(renderMyMonth).catch(function(e){app.innerHTML='<p class="sub">読み込みに失敗しました。再読み込みしてください。<br>'+esc(e)+'</p>';});return;}
    var fn=view==='contact'?renderContact:(view==='yukyu'?renderYukyu:renderBoard);
    var api=(view==='contact'||view==='yukyu')?view:'board';
    postApi(api).then(fn).catch(function(e){app.innerHTML='<p class="sub">読み込みに失敗しました。通信環境を確認して再読み込みしてください。<br>'+esc(e)+'</p>';});
  }

  // LIFF初期化 → idToken取得 → 画面描画（本人確認を全ビュー共通の前提にする）
  function start(){
    if(!window.liff){ app.innerHTML='<p class="sub">LIFF SDKを読み込めません（通信環境を確認してください）。</p>'; return; }
    liff.init({liffId:LIFF_ID}).then(function(){
      if(!liff.isLoggedIn()){ liff.login(); return; }
      idToken=liff.getIDToken();
      if(!idToken){
        if(!sessionStorage.getItem('kp_relogin_v')){ sessionStorage.setItem('kp_relogin_v','1'); liff.login(); return; }
        app.innerHTML='<p class="sub">本人確認トークンを取得できません。LIFFのScopeに「openid」が入っているかご確認ください。</p>'; return;
      }
      sessionStorage.removeItem('kp_relogin_v');
      load();
      if(view==='board'){ if(boardTimer) clearInterval(boardTimer); boardTimer=setInterval(load,30000); }
    }).catch(function(e){
      app.innerHTML='<p class="sub">初期化に失敗しました。LINEのメニューから開き直してください。<br>'+esc(e&&e.message?e.message:e)+'</p>';
    });
  }
  start();
</script>
</body>
</html>
